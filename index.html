<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Paremia</title>
  <meta name="description" content="Cada día, tres refranes de toda la vida reescritos en lenguaje de ventanilla. Adivina el original.">
  <!-- Vista previa al compartir el enlace (WhatsApp, X, Bluesky…): el icono del juego. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Almanaque">
  <meta property="og:title" content="Paremia">
  <meta property="og:description" content="Cada día, tres refranes de toda la vida reescritos en lenguaje de ventanilla. Adivina el original.">
  <meta property="og:url" content="https://joseleking.github.io/Paremia/">
  <meta property="og:image" content="https://joseleking.github.io/Paremia/icons/icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Icono de Paremia">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#f3e9d2">
  <script>
    // Modo claro u oscuro: el que se elija en Almanaque, común a todos los juegos. Sin elegir, claro.
    try {
      if (localStorage.getItem('almanaque:tema') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#1b1814';
      }
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Paremia">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <div id="portada" aria-hidden="true">
    <div class="portada__logo">
      <img src="icons/logo-portada-fondo.png" width="128" height="128" alt="">
      <img class="portada__comilla portada__comilla--izq" src="icons/logo-portada-comilla-izq.png" width="128" height="128" alt="">
      <img class="portada__comilla portada__comilla--der" src="icons/logo-portada-comilla-der.png" width="128" height="128" alt="">
    </div>
    <p class="portada__nombre">Paremia</p>
  </div>
  <div class="hoja">
    <header class="cabecera">
      <button class="icono-btn" id="btn-ayuda" type="button" aria-label="Cómo se juega">?</button>
      <div class="cabecera__titulo">
        <h1><img class="cabecera__logo" src="icons/logo-cabecera.png" width="34" height="34" alt="">Paremia</h1>
        <p class="cabecera__sub" id="subtitulo">Refranero para tiempos burocráticos</p>
      </div>
      <span class="cabecera__hueco" aria-hidden="true"></span>
    </header>

    <main id="app" aria-live="polite">
      <p class="cargando">Abriendo el refranero…</p>
    </main>
  </div>

  <dialog class="modal" id="modal" aria-labelledby="modal-titulo">
    <div class="modal__cuerpo" id="modal-cuerpo"></div>
    <button class="btn btn--sec modal__cerrar" id="modal-cerrar" type="button">Entendido</button>
  </dialog>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <script src="volver-almanaque.js?v=8" defer></script>
  <script src="app.js?v=13"></script>
</body>
</html>
